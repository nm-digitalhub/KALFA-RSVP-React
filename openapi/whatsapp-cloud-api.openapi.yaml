  /{Version}/{Phone-Number-ID}/deregister:
    post:
      tags:
        - Registration
      summary: Deregister Phone
      description: >-
        To deregister your phone, make a **POST** call to
        **`{{Phone-Number-ID}}/deregister`**. **Deregister Phone** removes a
        previously registered phone. You can always re-register your phone using
        by repeating the registration process.


        #### Response


        A successful response returns:


        ``` json

        {
            "success": true
        }


        ```
      operationId: deregisterPhone
      requestBody:
        content:
          text/plain:
            examples:
              Deregister Phone:
                value: ""
      responses:
        "200":
          description: ""
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: Phone-Number-ID
        in: path
        required: true
        schema:
          type: string
  /{Version}/{Phone-Number-ID}:
    get:
      tags:
        - Phone Numbers
      summary: Get Phone Number By ID
      description: |-
        When you query all the phone numbers for a WhatsApp Business Account, each phone number has an **`id`**. You can directly query for a phone number using this **`id`**.

        #### Response Parameters

        | Name                  | Description                 |
        |-----------------------|-----------------------------|
        | **`verified_name`**         | The verified name associated with the phone number.  |
        | **`display_phone_number`**  | The string representation of the phone number.       |
        | **`id`**                    | The ID associated with the phone number.                            |
        | **`quality_rating`**        | The quality rating of the phone number based on how messages have been received by recipients in recent days. Valid values are: <br/><ul><li>**`Green`**: High Quality</li><li>**`Yellow`**: Medium Quality</li><li>**`Red`**: Low Quality</li><li>**`NA`**: Quality has not been determined</li></ul>  <br/>For more information relating to quality rating, see [About WhatsApp Business Account Message Quality Rating](https://www.facebook.com/business/help/896873687365001).                     |
      operationId: getPhoneNumberById
      parameters:
        - name: fields
          in: query
          schema:
            type: string
            example: name_status
          description: >-
            The status of a display name associated with a specific phone
            number. The **`name_status`** value can be one of the following:


            * `APPROVED`: The name has been approved. You can download your
            certificate now.

            * `AVAILABLE_WITHOUT_REVIEW`: The certificate for the phone is
            available and display name is ready to use without review.

            * `DECLINED`: The name has not been approved. You cannot download
            your certificate.

            * `EXPIRED`: Your certificate has expired and can no longer be
            downloaded.

            * `PENDING_REVIEW`: Your name request is under review. You cannot
            download your certificate.

            NONE: No certificate is available.
      responses:
        "200":
          description: Get Phone Number By ID / Get Display Name Status (Beta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  display_phone_number:
                    type: string
                    example: +1 631-555-5555
                  id:
                    type: string
                    example: "1906385232743451"
                  name_status:
                    type: string
                    example: AVAILABLE_WITHOUT_REVIEW
                  quality_rating:
                    type: string
                    example: GREEN
                  verified_name:
                    type: string
                    example: Jasper's Market
              examples:
                Get Display Name Status (Beta):
                  value:
                    id: "105954558954427"
                    name_status: AVAILABLE_WITHOUT_REVIEW
                Get Phone Number By ID:
                  value:
                    display_phone_number: +1 631-555-5555
                    id: "1906385232743451"
                    quality_rating: GREEN
                    verified_name: Jasper's Market
    post:
      tags:
        - Phone Numbers
      summary: Set Two-Step Verification Code
      description: |-
        You can use this endpoint to change two-step verification code associated with your account. 
        After you change the verification code, future requests like changing the name, must use the new code. 

        **You set up two-factor verification and [register a phone number](https://developers.facebook.com/docs/whatsapp/cloud-api/reference/registration#register-phone) in the same API call.**

        You must use the parameters listed below to change two-step verification 


        ## Parameters

        | Name          |  Description   |
        |-------------- |--------------- |
        | **`pin`**   | **Required**.<br/> A 6-digit PIN you want to use for two-step verification. |
      operationId: setTwoStepVerificationCode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin:
                  type: string
                  example: "123456"
            examples:
              Set Two-Step Verification Code:
                value:
                  pin: "123456"
      responses:
        "200":
          description: Set Two-Step Verification Code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
              examples:
                Set Two-Step Verification Code:
                  value:
                    success: true
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: Phone-Number-ID
        in: path
        required: true
        schema:
          type: string
  /{Version}/{Phone-Number-ID}/request_code:
    post:
      tags:
        - Phone Numbers
      summary: Request Verification Code
      description: |-
        You need to verify the phone number you want to use to send messages to your customers. Phone numbers must be verified through SMS/voice call. The verification process can be done through the Graph API calls specified below.
            

        To verify a phone number using Graph API, make a **POST** request to **`{{PHONE_NUMBER_ID}}/request_code`**. In your call, include your chosen verification method and locale. You need to authenticate yourself using **{{User-Access-Token}}** (This is automatically done for you in the **`Request Verification Code`** request).

        #### Request Parameters

        | Name                  | Description                 |
        |-----------------------|-----------------------------|
        | **`code_method`**         | **Required**.<br/>Specifies the method for verification. Supported options are: `SMS` or `VOICE`.  |
        | **`locale`**         | **Required**.<br/>Specifies your locale. For instance: `"en_US"`.  |

        #### Response

        After a successful call to **`Request Verification Code`**, you will receive your verification code via the method you selected in **`code_method`**. To finish the verification process, you need to use the [**`Verify Code`**](https://developers.facebook.com/docs/whatsapp/cloud-api/reference/phone-numbers#verify) request.
      operationId: requestVerificationCode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code_method:
                  type: string
                  example: SMS
                locale:
                  type: string
                  example: en_US
            examples:
              Request Verification Code:
                value:
                  code_method: SMS
                  locale: en_US
      responses:
        "200":
          description: Request Verification Code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
              examples:
                Request Verification Code:
                  value:
                    success: true
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: Phone-Number-ID
        in: path
        required: true
        schema:
          type: string
  /{Version}/{Phone-Number-ID}/verify_code:
    post:
      tags:
        - Phone Numbers
      summary: Verify Code
      description: |-
        After you received a SMS or Voice request code from [**`Request Verification Code`**](https://developers.facebook.com/docs/whatsapp/cloud-api/reference/phone-numbers#verify), you need to verify the code that was sent to you. To verify this code, make a **POST** request to **`{{PHONE_NUMBER_ID}}/verify_code`** that includes the code as a parameter.

        #### Request Parameters

        | Name                  | Description                 |
        |-----------------------|-----------------------------|
        | **`code`**<br/>type: Numeric String | **Required**.<br/>The code you received after calling [**`Request Verification Code`**](https://developers.facebook.com/docs/whatsapp/cloud-api/reference/phone-numbers#verify)(**`{{PHONE_NUMBER_ID}}/request_code`**).  |
      operationId: verifyCode
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  example: <your-requested-code>
            examples:
              Verify Code:
                value:
                  code: <your-requested-code>
      responses:
        "200":
          description: Verify Code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
              examples:
                Verify Code:
                  value:
                    success: true
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: Phone-Number-ID
        in: path
        required: true
        schema:
          type: string
