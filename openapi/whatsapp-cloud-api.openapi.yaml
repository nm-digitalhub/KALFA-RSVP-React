  /{Version}/{Media-ID}:
    get:
      tags:
        - Media
      summary: Retrieve Media URL
      description: |-
        To retrieve your media’s URL, make a **GET** call to **`/{{Media-ID}}`**. Use the returned URL to download the media file. Note that clicking this URL (i.e. performing a generic GET) will not return the media; you must include an access token. For more information, see [Download Media](https://developers.facebook.com/docs/whatsapp/cloud-api/reference/media#download-media).

        You can also use the optional query **`?phone_number_id`** for **`Retrieve Media URL`** and **`Delete Media`**. This parameter checks to make sure the media belongs to the phone number before retrieval or deletion.

        #### Response

        A successful response includes an object with a media URL. The URL is only valid for 5 minutes. To use this URL, see [Download Media](https://developers.facebook.com/docs/whatsapp/cloud-api/reference/media#download-media).
      operationId: retrieveMediaUrl
      parameters:
        - name: phone_number_id
          in: query
          schema:
            type: string
            example: <PHONE_NUMBER_ID>
          description: Specifies that this action only be performed if the media belongs
            to the provided phone number.
      responses:
        "200":
          description: Retrieve Media URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_size:
                    type: string
                    example: "303833"
                  id:
                    type: string
                    example: "2621233374848975"
                  messaging_product:
                    type: string
                    example: whatsapp
                  mime_type:
                    type: string
                    example: image/jpeg
                  sha256:
                    type: string
                    example: <HASH>
                  url:
                    type: string
                    example: <URL>
              examples:
                Retrieve Media URL:
                  value:
                    file_size: "303833"
                    id: "2621233374848975"
                    messaging_product: whatsapp
                    mime_type: image/jpeg
                    sha256: <HASH>
                    url: <URL>
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: Media-ID
        in: path
        required: true
        schema:
          type: string
  /{Version}/{Media-ID}/:
    delete:
      tags:
        - Media
      summary: Delete Media
      description: |-
        To delete media, make a **DELETE** call to the ID of the media you want to delete.

        ## Prerequisites
        - [User Access Token](https://developers.facebook.com/docs/facebook-login/access-tokens#usertokens) with **`whatsapp_business_messaging`** permission
        - Media object ID from either uploading media endpoint or media message Webhooks

        ## Request
        [Perform requests in Graph API Explorer](https://developers.facebook.com/tools/explorer/?method=DELETE&path=media_id&version=v8.0)
      operationId: deleteMedia
      parameters:
        - name: phone_number_id
          in: query
          schema:
            type: string
            example: <PHONE_NUMBER_ID>
          description: Specifies that deletion of the media  only be performed if the
            media belongs to the provided phone number.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties: {}
      responses:
        "200":
          description: Delete Media
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
              examples:
                Delete Media:
                  value:
                    success: true
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: Media-ID
        in: path
        required: true
        schema:
          type: string
  /{Version}/{Media-URL}:
    get:
      tags:
        - Media
      summary: Download Media
      description: |-
        When you retrieve a media URL through the **GET** Media endpoint, you must use a User Access Token to download media content from the URL. If you click the URL from a browser, you will get an access error. <br/>
        > **Note**: all media URLs will expire after 5 minutes, you need to retrieve the media URL again if it expires.

        ## Prerequisites
        - [User Access Token](https://developers.facebook.com/docs/facebook-login/access-tokens#usertokens) with **`whatsapp_business_messaging`** permission
        - A media URL obtained from retrieving media url endpoint 

        ## Response:
        If successful,  you receive the binary data of media saved in **`media_file`**, response headers contain a `content-type` header to indicate the mime type of returned data. For more information, see [Supported Media Types](https://developers.facebook.com/docs/whatsapp/cloud-api/reference/media#supported-media-types).

        If media fails to download, you receive a **404 Not Found** response code. In that case, we recommend that you try to [Retrieve Media URL](https://developers.facebook.com/docs/whatsapp/cloud-api/reference/media#retrieve-media-url) and download again. If doing so doesn't resolve the issue, please try to renew the **`USER_ACCESS_TOKEN`** then retry downloading the media.
      operationId: downloadMedia
      responses:
        "200":
          description: Download Media
          content:
            text/plain:
              examples:
                Download Media:
                  value: ""
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: Media-URL
        in: path
        required: true
        schema:
          type: string
  /{Version}/app/uploads/:
    post:
      tags:
        - Business Profiles
      summary: Resumable Upload - Create an Upload Session
      description: |-
        The Resumable Upload series of requests allow you to upload Profile Pictures to Meta so you can receive a handle to update these pictures in the Business Profile API. The Resumable Upload requests consist of the following:

        * **Resumable Upload - Create an Upload Session**
        * **Resumable Upload - Upload File Data**
        * **Resumable Upload - Query File Upload Status**

        To create a new upload session, make a **POST** call using the `/app/uploads` endpoint.

        For more information, see [Create an Upload Session](https://developers.facebook.com/docs/graph-api/guides/upload#step-1--create-a-session).

        **Response**  
        The call returns a server-generated value that includes the session ID that you can use in later calls. 

        >Copy this value and Open the **Environment quick look** in Postman and paste it in the **CURRENT VALUE** for `Upload-ID`.
      operationId: resumableUploadCreateAnUploadSession
      parameters:
        - name: file_length
          in: query
          schema:
            type: string
            example: <YOUR_FILE_LENGTH>
          description: "**Required**<br/>Specifies the size of your file in bytes."
        - name: file_type
          in: query
          schema:
            type: string
            example: image/jpeg
          description: "**Required**<br/>Specifies the MIME type. Values are
            <ul><li>`image/jpeg`</li><li>`image/png`</li><li>`video/mp4`</li></\
            ul>"
        - name: file_name
          in: query
          schema:
            type: string
            example: myprofile.jpg
          description: "**Optional**<br/>Specifies the file name you are using to create
            the session."
      responses:
        "200":
          description: Resumable Upload - Create an Upload Session
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: upload:MTphdHRhY2htZW50Ojlk2mJiZxUwLWV6MDUtNDIwMy05yTA3LWQ4ZDPmZGFkNTM0NT8=?sig=ARZqkGCA_uQMxC8nHKI
              examples:
                Resumable Upload - Create an Upload Session:
                  value:
                    id: upload:MTphdHRhY2htZW50Ojlk2mJiZxUwLWV6MDUtNDIwMy05yTA3LWQ4ZDPmZGFkNTM0NT8=?sig=ARZqkGCA_uQMxC8nHKI
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
  /{Version}/{Upload-ID}:
    get:
      tags:
        - Business Profiles
      summary: Resumable Upload - Query File Upload Status
      description: |-
        You can query the status of an upload session by making a **GET** call to an endpoint that is named based on the **`Upload-ID`** that was returned through the **Resumable Upload - Create an Upload Session** request.

        When uploading data, you **must include the access token as an HTTP header.**

        **Example**
        ``` bash
        GET https://graph.facebook.com/v14.0/upload:MTphdHRhY2htZW50Ojlk2mJiZxUwLWV6MDUtNDIwMy05yTA3LWQ4ZDPmZGFkNTM0NT8=?sig=ARZqkGCA_uQMxC8nHKI HTTP/1.1
        Authorization: OAuth {{USER_ACCESS_TOKEN}}

        ```

        For more information, see [Query File Upload Status after an Interruption](https://developers.facebook.com/docs/graph-api/guides/upload#interruptions).

        **Response**
        The result will be a JSON-encoded ID and offset that looks like the following:

        ``` json
        { "id": "upload:MTphdHRhY2htZW50Ojlk2mJiZxUwLWV6MDUtNDIwMy05yTA3LWQ4ZDPmZGFkNTM0NT8=?sig=ARZqkGCA_uQMxC8nHKI", "file_offset": 0 }
        ```
      operationId: resumableUploadQueryFileUploadStatus
      parameters:
        - name: cache-control
          in: header
          schema:
            type: string
            example: no-cache
      responses:
        "200":
          description: Resumable Upload - Query File Upload Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_offset:
                    type: number
                    example: 0
                  id:
                    type: string
                    example: upload:MTphdHRhY2htZW50Ojlk2mJiZxUwLWV6MDUtNDIwMy05yTA3LWQ4ZDPmZGFkNTM0NT8=?sig=ARZqkGCA_uQMxC8nHKI
              examples:
                Resumable Upload - Query File Upload Status:
                  value:
                    file_offset: 0
                    id: upload:MTphdHRhY2htZW50Ojlk2mJiZxUwLWV6MDUtNDIwMy05yTA3LWQ4ZDPmZGFkNTM0NT8=?sig=ARZqkGCA_uQMxC8nHKI
    post:
      tags:
        - Business Profiles
      summary: Resumable Upload - Upload File Data
      description: |-
        To upload a profile picture to your business profile, make a **POST** call to the named endpoint {{Version}}/{{Upload-ID}}, where **Upload-ID** is the value you received from **Resumable Upload - Create an Upload Session**. This value should look like the following:

        ``` json
        "upload:MTphdHRhY2htZW50Ojlk2mJiZxUwLWV6MDUtNDIwMy05yTA3LWQ4ZDPmZGFkNTM0NT8=?sig=ARZqkGCA_uQMxC8nHKI"

        ```

        The **`file_offset`** parameter **must** be included as an HTTP header. It will not work as a query parameter.

        The access token must be included in an Authorization HTTP header. It cannot work as a query parameter.

        For more information, see [Initiate Data Upload](https://developers.facebook.com/docs/graph-api/guides/upload#step-2--initiate-upload).

        **Response**  
        The call returns a handle that includes the session ID that you can use to update your profile picture using **Update Business Profile**.
      operationId: resumableUploadUploadFileData
      parameters:
        - name: file_offset
          in: header
          schema:
            type: string
            example: "0"
          description: Specifies the offset to start the upload. The offset value should
            always be `0`.
      requestBody:
        content: {}
      responses:
        "200":
          description: Resumable Upload - Upload File Data
          content:
            application/json:
              schema:
                type: object
                properties:
                  h:
                    type: string
                    example: 2:c2FtcGxlLm1wNA==:image/jpeg:GKAj0gAUCZmJ1voFADip2iIAAAAAbugbAAAA:e:1472075513:ARZ_3ybzrQqEaluMUdI
              examples:
                Resumable Upload - Upload File Data:
                  value:
                    h: 2:c2FtcGxlLm1wNA==:image/jpeg:GKAj0gAUCZmJ1voFADip2iIAAAAAbugbAAAA:e:1472075513:ARZ_3ybzrQqEaluMUdI
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: Upload-ID
        in: path
        required: true
        schema:
          type: string
  /{Version}/{Phone-Number-ID}/whatsapp_business_profile:
    get:
      tags:
        - Business Profiles
      summary: Get Business Profile
      description: >-
        To get information about a business profile, make a **GET** call to the
        **`/{{Phone-Number-ID}}/whatsapp_business_profile`** endpoint. Within
        the **`whatsapp_business_profile`** request, you can specify what you
        want to know from the business. 


        ## Fields


        | Name                    | Description                          |

        |-------------------------|--------------------------------------|

        | **`messaging_product`** | **Required**.<br/>The messaging service used
        for the request. Always set the value to `"whatsapp"` if you are using
        WhatsApp for Business API.|

        | **`address`**           | The address of the business. The maximum
        character limit for the string is 256. |

        | **`description`** |Description of the business. The maximum character
        limit for the string is 256. |

        | **`vertical`** | **Optional**. <br/>The industry type of the business.
        This can be either an empty string or one of the accepted
        values<br/><br/>**Values**: `UNDEFINED`, `OTHER`, `AUTO`, `BEAUTY`,
        `APPAREL`, `EDU`, `ENTERTAIN`, `EVENT_PLAN`, `FINANCE`, `GROCERY`,
        `GOVT`, `HOTEL`, `HEALTH`, `NONPROFIT`, `PROF_SERVICES`, `RETAIL`,
        `TRAVEL`, `RESTAURANT`, or `NOT_A_BIZ`.|

        | **`about`** | **Optional**. <br/>The text to display in business
        profile's About section The max length for the string is 139 characters.
        The minimum length for the string is 1 character.<br/><br/>Rendered
        emojis are supported however their unicode values are not. Emoji unicode
        values must be Java- or JavaScript-escape encoded.|

        | **`email`** | **Optional**. <br/>The contact email address (in valid
        email format) of the business. The maximum character limit for the
        string is 128 characters.|

        | **`websites`** | **Optional**. <br/>The URLs associated with the
        business. For instance, a website, Facebook Page, or Instagram. You must
        include the http:// or https:// portion of the URL. There is a maximum
        of 2 websites with a maximum of 256 characters each. |

        | **`profile_picture_handle`** | **Optional**. <br/>The handle of the
        profile picture generated from a call to the [Resumable Upload
        API](https://developers.facebook.com/docs/graph-api/guides/upload).|


        <!-- grahamp 10262022: Removed table item:

        | **`id`**                | **Required**.<br/>The ID of the business
        profile object. |-->
      operationId: getBusinessProfile
      responses:
        "200":
          description: Get Business Profile ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        business_profile:
                          type: object
                          properties:
