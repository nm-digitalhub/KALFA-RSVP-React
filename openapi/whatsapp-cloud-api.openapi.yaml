openapi: 3.0.3
info:
  title: WhatsApp Cloud API
  description: |-
    [WhatsApp Cloud API](https://developers.facebook.com/docs/whatsapp/cloud-api), hosted by Meta, is the official WhatsApp Business Platform API used for business messaging. This collection contains common queries, sample responses, and links to supporting documentation that can help you quickly get started with the API.

    ## **Cloud API Overview**

    Cloud API allows medium and large businesses to communicate with customers at scale. Using the API, businesses can build systems that connect thousands of customers with agents or bots, enabling both programmatic and manual communication. Additionally, businesses can integrate the API with numerous backend systems, such as CRM and marketing platforms.

    [https://developers.facebook.com/docs/whatsapp/cloud-api/overview](https://developers.facebook.com/docs/whatsapp/cloud-api/overview)

    ## Getting Started with Cloud API

    To use the API and this collection you must have a Meta business portfolio, a WhatsApp Business Account, and a business phone number. If you complete the steps in the Cloud API [Get Started](https://developers.facebook.com/docs/whatsapp/cloud-api/get-started) guide, these assets will be created for you.

    ## Get Started as a Solution Partner

    [This guide](https://developers.facebook.com/docs/whatsapp/solution-providers/get-started-for-solution-partners) goes over the steps Solution Partners need to take in order to offer the Cloud API to their customers.

    ## Migrating from On-Premises API to Cloud API

    [This guide explains how to migrate](https://developers.facebook.com/docs/whatsapp/cloud-api/guides/migrating-from-onprem-to-cloud) business phone numbers from On-Premises API to Cloud API.

    ## Environment

    This collection has a corresponding WhatsApp Cloud API Postman [environment](https://learning.postman.com/docs/sending-requests/managing-environments/) which you must select when using the collection. Set **current values** for the variables defined in this environment if you wish to use the collection to perform queries.

    You can find most of these values in the [WhatsApp Manager](https://business.facebook.com/wa/manage/home/) or the **WhatsApp** > **Getting Started** panel in the [app dashboard](https://developers.facebook.com/apps). However, if you have an access token and your business portfolio ID, you can use queries in the collection to get the remaining values.

    ## Access tokens

    The API supports both user and system user access tokens. You can get a user access token by loading your app in the [app dashboard](https://developers.facebook.com/apps) and navigating to the WhatsApp > Getting Started panel. Alternatively you can use the [Graph API Explorer](https://developers.facebook.com/tools/explorer/) to generate one.

    Since user access tokens expire after 24 hours, you'll likely want to generate a system user access token, which lasts up to 60 days (or permanently, if you wish). See [Access Tokens](https://developers.facebook.com/docs/whatsapp/business-management-api/get-started#access-tokens) to learn how to create a system user and system user access token.

    Once you have your token, save it as a **current value** in the environment.

    ## Business portfolio ID

    You can get your business portfolio ID by signing into the [Meta Business Suite](https://business.facebook.com). The ID appears in the URL as the `business_id` query string parameter value. Once you save this as a **current value** in the environment, go to the WhatsApp Business Account (WABA) folder and run the **Get all owned WABAs** query. This will return your WABA ID, which you can save to your environment and then use to determine your business phone number ID.

    ## Permissions

    The API only relies on two permissions:

    - whatsapp_business_management
        
    - whatsapp_business_messaging
        

    Note that if you get a user access token from the app dashboard, your app will automatically be granted these permissions (by you, on your behalf), so you can use the token to test right away.

    Queries that target your business portfolio require the business_management permission, which you may also need based on your business use case. Most developers do not need this permission, however, as accessing your business portfolio is uncommon, and the Meta Business Suite provides nearly all of this functionality anyway.

    ## Access token debugger

    You can paste any token you generate into the [access token debugger](https://developers.facebook.com/tools/debug/accesstoken/) to see what type of token it is and what permission you have granted to your app.

    ## Pagination

    Endpoints that return lists/collections may [paginate results](https://developers.facebook.com/docs/graph-api/results) (you'll see previous and next properties in the response). Use the URLs from these properties to get the previous or next set of results. Note that if you click one of these links in Postman, it will open a new query in a new tab which you must save before running (otherwise it can't read your environment variables), so you may wish to cut and paste the URL and run the query in the same tab in which it was returned.
  version: 1.0.0
  contact: {}
servers:
  - url: https://graph.facebook.com
paths:
  /{Version}/{WABA-ID}/subscribed_apps:
    get:
      tags:
        - Webhook Subscriptions
      summary: Get All Subscriptions for a WABA
      description: "To get a list of apps subscribed to Webhooks for a WABA, send a
        **GET** request to the **`subscribed_apps`** endpoint on the WABA:"
      operationId: getAllSubscriptionsForAWaba
      responses:
        "200":
          description: Get All Subscriptions for a WABA
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        whatsapp_business_api_data:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "7234002551525653"
                            link:
                              type: string
                              example: <APP1_LINK>
                            name:
                              type: string
                              example: <APP1_NAME>
                    example:
                      - whatsapp_business_api_data:
                          id: "7234002551525653"
                          link: <APP1_LINK>
                          name: <APP1_NAME>
                      - whatsapp_business_api_data:
                          id: "3736565603394103"
                          link: <APP2_LINK>
                          name: <APP2_LINK>
              examples:
                Get All Subscriptions for a WABA:
                  value:
                    data:
                      - whatsapp_business_api_data:
                          id: "7234002551525653"
                          link: <APP1_LINK>
                          name: <APP1_NAME>
                      - whatsapp_business_api_data:
                          id: "3736565603394103"
                          link: <APP2_LINK>
                          name: <APP2_LINK>
    post:
      tags:
        - Webhook Subscriptions
      summary: Subscribe to your WABA
      description: >-
        To make sure you receive notifications for your account you need to
        subscribe your app to your WABA.


        #### Response


        If your request is successful, all Webhook events for the phone numbers
        under this account are sent to your configured Webhooks endpoint.
      operationId: subscribeToYourWaba
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                override_callback_uri:
                  type: string
                  example: https://alternate-endpoint-callback.com/webhook
                verify_token:
                  type: string
                  example: myvoiceismypassport?
            examples:
              Override Callback URL:
                value:
                  override_callback_uri: https://alternate-endpoint-callback.com/webhook
                  verify_token: myvoiceismypassport?
      responses:
        "200":
          description: Subscribe to your WABA / Subscribe to a WABA / Override Callback URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        override_callback_uri:
                          type: string
                          example: https://alternate-endpoint-callback.com/webhook
                        whatsapp_business_api_data:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "670843887433847"
                            link:
                              type: string
                              example: https://www.facebook.com/games/?app_id=67084...
                            name:
                              type: string
                              example: Jaspers Market
                    example:
                      - override_callback_uri: https://alternate-endpoint-callback.com/webhook
                        whatsapp_business_api_data:
                          id: "670843887433847"
                          link: https://www.facebook.com/games/?app_id=67084...
                          name: Jaspers Market
                  success:
                    example: "true"
                    anyOf:
                      - type: string
                        example: "true"
                      - type: boolean
                        example: true
              examples:
                Override Callback URL:
                  value:
                    data:
                      - override_callback_uri: https://alternate-endpoint-callback.com/webhook
                        whatsapp_business_api_data:
                          id: "670843887433847"
                          link: https://www.facebook.com/games/?app_id=67084...
                          name: Jaspers Market
                Subscribe to a WABA:
                  value:
                    success: true
                Subscribe to your WABA:
                  value:
                    success: "true"
    delete:
      tags:
        - Webhook Subscriptions
      summary: Unsubscribe from a WABA
      description: To unsubscribe your app from webhooks for a WhatsApp Business
        Account, send a **DELETE** request to the `/subscribed_apps/` endpoint
        on the WABA.
      operationId: unsubscribeFromAWaba
      responses:
        "200":
          description: Unsubscribe from a WABA
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
              examples:
                Unsubscribe from a WABA:
                  value:
                    success: true
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: WABA-ID
        in: path
        required: true
        schema:
          type: string
  /{Version}/{WABA-ID}/phone_numbers:
    get:
      tags:
        - Phone Numbers
      summary: Get Phone Number ID
      description: |-
        To send messages, you need to register the phone number you want to use. This is the business phone number we mentioned in [Set up Assets](https://developers.facebook.com/docs/whatsapp/cloud-api/get-started#set-up-assets).

        Before you can proceed to registration, you need to find that phone number’s ID.

        #### Response

        If the request is successful, the response includes all phone numbers connected to your WABA.

        Save the ID for the phone number you want to register. For more information about this endpoint, see [Read Phone Numbers](https://developers.facebook.com/docs/whatsapp/business-management-api/phone-numbers).

        #### Migration Exception

        If you are migrating a phone number from the On-Premises API to the Cloud API, there are extra steps you need to perform before registering a phone number with the Cloud API. For more information regarding the full process, see [Migrate Between On-Premises and Cloud API](#79b8156b-8c83-4db9-94ac-dd9aaaa67390).

        To get your phone number’s ID, make the following API call:
      operationId: getPhoneNumberId
      parameters:
        - name: fields
          in: query
          schema:
            type: string
            example: id,is_official_business_account,display_phone_number,verified_name
        - name: filtering
          in: query
          schema:
            type: string
            example: "[{'field':'account_mode','operator':'EQUAL','value':'SANDBOX'}]"
      responses:
        "200":
          description: Get Phone Number ID / Get Phone Numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        display_phone_number:
                          type: string
                          example: +1 631-555-5555
                        id:
                          type: string
                          example: "1906385232743451"
                        quality_rating:
                          type: string
                          example: GREEN
                        verified_name:
                          type: string
                          example: Jasper's Market
                    example:
                      - display_phone_number: +1 631-555-5555
                        id: "1906385232743451"
                        quality_rating: GREEN
                        verified_name: Jasper's Market
                      - display_phone_number: +1 631-555-5556
                        id: "1913623884432103"
                        quality_rating: NA
                        verified_name: Jasper's Ice Cream
              examples:
                Get Phone Number ID:
                  value:
                    data:
                      - display_phone_number: +1 631-555-5555
                        id: "1906385232743451"
                        quality_rating: GREEN
                        verified_name: Jasper's Market
                      - display_phone_number: +1 631-555-5556
                        id: "1913623884432103"
                        quality_rating: NA
                        verified_name: Jasper's Ice Cream
                Get Phone Numbers:
                  value:
                    data:
                      - display_phone_number: +1 631-555-5555
                        id: "1906385232743451"
                        quality_rating: GREEN
                        verified_name: Jasper's Market
                      - display_phone_number: +1 631-555-5556
                        id: "1913623884432103"
                        quality_rating: NA
                        verified_name: Jasper's Ice Cream
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: WABA-ID
        in: path
        required: true
        schema:
          type: string
  /{Version}/{Phone-Number-ID}/register:
    post:
      tags:
        - OnPrem Account Migration
      summary: Register Phone Number
      description: |-
        With your phone number’s ID in hand, you can register it. In the registration API call, you perform two actions at the same time:

        1.  Register the phone.
        2.  Enable [two-step verification](https://faq.whatsapp.com/general/verification/about-two-step-verification) by setting a 6-digit registration code — you must set this code on your end. Save and memorize this code as it can be requested later. **Setting up two-factor authentication is a requirement to use the Cloud API.**
            

        **Embedded Signup Users**

        A phone number **must** be registered within 14 days after going through the Embedded Signup flow. If the phone number is not registered during that window, the phone number must go through the Embedded Signup flow again prior to registration.
      operationId: registerPhoneNumber
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                backup:
                  type: object
                  properties:
                    data:
                      type: string
                      example: BACKUP_DATA
                    password:
                      type: string
                      example: P455w0rd##
                messaging_product:
                  type: string
                  example: whatsapp
                pin:
                  type: string
                  example: "123678"
            examples:
              Migrate Account:
                value:
                  backup:
                    data: BACKUP_DATA
                    password: P455w0rd##
                  messaging_product: whatsapp
                  pin: "123678"
              Register Phone:
                value:
                  messaging_product: whatsapp
                  pin: "123456"
              Register Phone Number:
                value:
                  messaging_product: whatsapp
                  pin: 6-digit-pin
      responses:
        "200":
          description: Register Phone Number / Register Phone / Migrate Account
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    example: "true"
                    anyOf:
                      - type: string
                        example: "true"
                      - type: boolean
                        example: true
                      - type: string
                        example: "true"
              examples:
                Migrate Account:
                  value:
                    success: "true"
                Register Phone:
                  value:
                    success: true
                Register Phone Number:
                  value:
                    success: "true"
    parameters:
      - name: Version
        in: path
        required: true
        schema:
          type: string
      - name: Phone-Number-ID
        in: path
        required: true
        schema:
          type: string
  /{Version}/{Phone-Number-ID}/messages:
    put:
      tags:
        - Messages
      summary: Mark Message As Read
      description: |-
        When you receive an incoming message from Webhooks, you could use messages endpoint to change the status of it to read.  
        We recommend marking incoming messages as read within 30 days of receipt.  
        **Note**: you cannot mark outgoing messages you sent as read.

        You need to obtain the **`message_id`** of the incoming message from Webhooks.

        For a more in depth guide for marking messages as read, see [Guide: Mark Messages as Read](https://developers.facebook.com/docs/whatsapp/cloud-api/guides/mark-message-as-read).
      operationId: markMessageAsRead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  type: string
                  example: wamid.234123
                messaging_product:
                  type: string
                  example: whatsapp
                status:
                  type: string
                  example: read
            examples:
              Mark Message As Read:
                value:
                  message_id: wamid.234123
                  messaging_product: whatsapp
                  status: read
      responses:
        "200":
          description: Mark Message As Read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
              examples:
                Mark Message As Read:
                  value:
                    success: true
    post:
      tags:
        - Examples
      summary: Send Test Message
      description: Send Test Message
      operationId: sendTestMessage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                messaging_product:
                  type: string
                  example: whatsapp
                template:
                  type: object
                  properties:
                    components:
                      type: array
                      items:
                        type: object
                        properties:
                          index:
                            type: number
                            example: 0
                          parameters:
                            type: array
                            items:
                              type: object
                              properties:
                                text:
                                  type: string
                                  example: "*Mr. Jones*"
                                type:
                                  type: string
                                  example: text
                            example:
                              - text: "*Mr. Jones*"
                                type: text
                          sub_type:
                            type: string
                            example: quick_reply
                          type:
                            type: string
                            example: body
                      example:
                        - parameters:
                            - text: "*Mr. Jones*"
                              type: text
                          type: body
                        - index: 0
                          parameters:
                            - text: Yes
                              type: text
                          sub_type: quick_reply
                          type: button
                        - index: 1
                          parameters:
                            - text: No
                              type: text
                          sub_type: quick_reply
                          type: button
                    language:
                      type: object
                      properties:
                        code:
                          type: string
                          example: en_US
                        policy:
                          type: string
                          example: deterministic
                    name:
                      type: string
                      example: sample_issue_resolution
                to:
                  type: string
                  example: "{{Recipient-Phone-Number}}"
                type:
                  type: string
                  example: template
            examples:
              Send Audio Message by ID:
                value:
                  audio:
                    id: <AUDIO_OBJECT_ID>
                    voice: true
                  messaging_product: whatsapp
                  recipient_type: individual
                  to: "{{Recipient-Phone-Number}}"
                  type: audio
              Send Audio Message by URL:
                value:
                  audio:
                    link: <http(s)://audio-url>
                    voice: true
                  messaging_product: whatsapp
                  recipient_type: individual
                  to: "{{Recipient-Phone-Number}}"
                  type: audio
              Send Catalog Message:
                value:
                  interactive:
                    action:
                      name: catalog_message
                      parameters:
                        thumbnail_product_retailer_id: 2lc20305pt
                    body:
                      text: Hello! Thanks for your interest. Ordering is easy. Just visit our catalog
                        and add items to purchase.
                    footer:
                      text: Best grocery deals on WhatsApp!
                    type: catalog_message
                  messaging_product: whatsapp
                  recipient_type: individual
                  to: "+16505551234"
                  type: interactive
              Send Catalog Template Message:
                value:
                  messaging_product: whatsapp
                  recipient_type: individual
