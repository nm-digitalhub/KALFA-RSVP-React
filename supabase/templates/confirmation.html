<!-- KALFA signup-confirmation email. Deployed via
     scripts/deploy-confirmation-email-template.mjs (Management API), not the
     dashboard. The link routes through /auth/confirm with token_hash +
     type=signup + next=/app. The link host comes from RedirectTo (the
     emailRedirectTo our signup/resend actions pass = APP_ORIGIN), never from
     SiteURL. NOTE: keep this comment free of Go-template braces — Supabase
     renders them anywhere, including inside comments. -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>אישור כתובת המייל — KALFA</title>
  </head>
  <body dir="rtl" style="margin:0;padding:0;background:#f6f6f6;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f6f6;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" dir="rtl" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;text-align:right;">
            <tr>
              <td dir="rtl" style="font-size:20px;font-weight:bold;color:#111111;padding-bottom:12px;">
                ברוכים הבאים ל־KALFA
              </td>
            </tr>
            <tr>
              <td dir="rtl" style="font-size:15px;line-height:1.6;color:#444444;padding-bottom:24px;">
                נותר צעד אחד כדי לסיים את ההרשמה. לחצו על הכפתור כדי לאשר את כתובת המייל ולהיכנס לחשבון.
              </td>
            </tr>
            <tr>
              <td dir="rtl" style="padding-bottom:24px;">
                <a
                  href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=signup&amp;next=/app"
                  style="display:inline-block;background:#111111;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;padding:12px 28px;border-radius:8px;"
                >
                  אישור כתובת המייל
                </a>
              </td>
            </tr>
            <tr>
              <td dir="rtl" style="font-size:13px;line-height:1.6;color:#888888;">
                אם לא נרשמתם ל־KALFA&rlm;, אפשר להתעלם מהודעה זו ולא ייפתח עבורכם חשבון.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
