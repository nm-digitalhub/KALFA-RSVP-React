<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>עריכת הצעה</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#4f39f6}a:hover{opacity:.8}
</style>
</helmet>
<div dir="rtl" style="width: 760px; height: 1100px; box-sizing: border-box; padding: 32px 44px; font-family: Heebo, system-ui, sans-serif; color: #0a0a0a; background: #ffffff; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700">עריכת הצעה</h1>
    <a href="Offers.dc.html" style="font-size: 14px; color: #737373; text-decoration: none"><span aria-hidden="true">→</span> חזרה להצעות</a>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="name" style="display: block; font-size: 14px; font-weight: 500">שם ההצעה</label>
      <input id="name" value="[שם ההצעה]: הנחה אחרי התנגדות מחיר" style="width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #e5e5e5; padding: 8px 12px; font: 400 14px Heebo, system-ui, sans-serif">
      <p style="margin: 0; font-size: 12px; color: #737373">לצוות בלבד. הלקוח לא רואה את השם.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="kind" style="display: block; font-size: 14px; font-weight: 500">סוג ההנחה</label>
        <select id="kind" style="width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #e5e5e5; background: #ffffff; padding: 8px 12px; font: 400 14px Heebo, system-ui, sans-serif">
          <option>אחוז ממחיר החבילה</option>
          <option>סכום קבוע בשקלים</option>
        </select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="value" style="display: block; font-size: 14px; font-weight: 500">גובה ההנחה</label>
        <input id="value" inputmode="decimal" value="5" style="width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #e5e5e5; padding: 8px 12px; font: 400 14px Heebo, system-ui, sans-serif">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="days" style="display: block; font-size: 14px; font-weight: 500">תוקף, בימים מרגע ההקצאה</label>
      <input id="days" inputmode="numeric" placeholder="[ימים]" style="width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #e5e5e5; padding: 8px 12px; font: 400 14px Heebo, system-ui, sans-serif">
    </div>

    <hr style="width: 100%; border: 0; border-top: 1px solid #e5e5e5; margin: 0">

    <fieldset style="display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0">
      <legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px">חבילות שההצעה כוללת</legend>
      <div style="display: flex; align-items: center; gap: 8px"><input id="p1" type="checkbox" checked style="width: 16px; height: 16px"><label for="p1" style="font-size: 14px; font-weight: 500">Kalfa RSVP 100 WIN · <span dir="ltr">₪100</span> ← <span dir="ltr">₪95</span></label></div>
      <div style="display: flex; align-items: center; gap: 8px"><input id="p2" type="checkbox" checked style="width: 16px; height: 16px"><label for="p2" style="font-size: 14px; font-weight: 500">אישורי הגעה — וואטסאפ + שיחות AI · <span dir="ltr">₪200</span> ← <span dir="ltr">₪190</span></label></div>
      <p style="margin: 0; font-size: 12px; color: #737373">רק חבילות פעילות שמוצעות ללקוחות מופיעות כאן.</p>
    </fieldset>

    <hr style="width: 100%; border: 0; border-top: 1px solid #e5e5e5; margin: 0">

    <fieldset style="display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0">
      <legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px">מי רשאי להקצות</legend>
      <div style="display: flex; align-items: center; gap: 8px"><input id="w1" type="checkbox" checked style="width: 16px; height: 16px"><label for="w1" style="font-size: 14px; font-weight: 500">עומר, סוכן המכירות, בשיחה</label></div>
      <div style="display: flex; align-items: center; gap: 8px"><input id="w2" type="checkbox" checked style="width: 16px; height: 16px"><label for="w2" style="font-size: 14px; font-weight: 500">צוות עם הרשאת חיוב</label></div>
    </fieldset>

    <div style="display: flex; align-items: center; gap: 8px"><input id="active" type="checkbox" checked style="width: 16px; height: 16px"><label for="active" style="font-size: 14px; font-weight: 500">פעילה</label></div>

    <p style="margin: 0; font-size: 12px; color: #737373">שינוי ההצעה חל רק על הטבות שיוקצו מעכשיו. הטבות שכבר הוקצו שומרות את התנאים והמחירים שלהן.</p>

    <button type="button" style="width: 100%; height: 40px; border: 0; border-radius: 10px; background: #4f39f6; color: #ffffff; font: 500 14px Heebo, system-ui, sans-serif">שמירה</button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":1100}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
