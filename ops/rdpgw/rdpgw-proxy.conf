# /etc/nginx/conf.d/rdpgw-proxy.conf   -- DRAFT, not applied.
# gw.kalfa.me : RD Gateway front door for rdpgw (127.0.0.1:3013).
# Pattern follows /etc/nginx/conf.d/beta-proxy.conf and cto-proxy.conf (hand-written
# conf.d file, loaded before Plesk's zz010_psa_nginx.conf; Plesk never regenerates it).

map $http_upgrade $rdgw_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=rdgw_req:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=rdgw_conn:10m;

# No $request / $args / $request_uri: nothing that could carry a token or query string.
log_format rdgw '$remote_addr [$time_iso8601] $request_method $uri $status '
                'rt=$request_time bytes=$body_bytes_sent '
                'rdgid="$http_rdg_connection_id" upg="$http_upgrade" ua="$http_user_agent"';

server {
    listen 217.154.17.185:443 ssl;
    http2 off;                      # RD Gateway = HTTP/1.1 (+WebSocket upgrade); h2 has no Upgrade
    server_name gw.kalfa.me;

    ssl_certificate     /opt/psa/var/modules/letsencrypt/etc/live/kalfa.me/fullchain.pem;   # *.kalfa.me
    ssl_certificate_key /opt/psa/var/modules/letsencrypt/etc/live/kalfa.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # rdpgw README, "Client Caveats": cipher list known to work with mstsc (key is RSA-2048 -> ECDHE-RSA/DHE-RSA suites)
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;

    access_log /var/log/rdpgw/nginx-access.log rdgw;
    error_log  /var/log/rdpgw/nginx-error.log warn;

    client_max_body_size 0;

    # Allow-list, not block-list: everything except the RDG endpoint is a 404, which also
    # covers /connect, /metrics, /tokeninfo, /api/v1/*, /static, /assets, /callback, /KdcProxy.
    location / { return 404; }

    location ^~ /remoteDesktopGateway/ {
        limit_req   zone=rdgw_req burst=20 nodelay;
        limit_req_status 429;
        limit_conn  rdgw_conn 10;

        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $rdgw_connection_upgrade;
        proxy_set_header Host       $host;
        # $remote_addr (NOT $proxy_add_x_forwarded_for): the client cannot prepend a spoofed hop,
        # rdpgw takes XFF[0] as the client IP when the peer is in Server.TrustedProxies.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # nginx IS in rdpgw's Header.TrustedProxies (127.0.0.1): never let a client smuggle identity headers.
        proxy_set_header X-Kalfa-Staff-Id "";
        proxy_set_header X-Kalfa-Internal "";

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_next_upstream     off;
        proxy_connect_timeout   5s;
        proxy_read_timeout      1d;
        proxy_send_timeout      1d;
    }
}
